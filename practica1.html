<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Cursos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<main class="container mt-5">

    <h1 class="mb-4">Sistema de Gestión de Cursos</h1>

    <h2>Crear Curso</h2>

    <form
        action="https://paginas-web-cr.com/Api/form/crearcurso.php"
        method="POST"
        class="mt-4"
    >

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>

            <input
                type="text"
                class="form-control"
                name="nombre"
                id="nombre"
                placeholder="Nombre del curso"
                required
            >
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">
                Descripción
            </label>

            <input
                type="text"
                class="form-control"
                name="descripcion"
                id="descripcion"
                placeholder="Descripción del curso"
                required
            >
        </div>

        <div class="mb-3">
            <label for="tiempo" class="form-label">
                Tiempo
            </label>

            <input
                type="text"
                class="form-control"
                name="tiempo"
                id="tiempo"
                placeholder="Duración del curso"
                required
            >
        </div>

        <div class="mb-3">
            <label for="usuario" class="form-label">
                Usuario
            </label>

            <input
                type="text"
                class="form-control"
                name="usuario"
                id="usuario"
                placeholder="Usuario"
                required
            >
        </div>

        <div class="mb-3">
            <label for="return_url" class="form-label">
                Return URL
            </label>

            <input
                type="text"
                class="form-control"
                name="return_url"
                id="return_url"
                value="http://127.0.0.1:5500/index.html"
                readonly
            >
        </div>

        <button
            type="reset"
            class="btn btn-primary"
        >
            Reset
        </button>

        <button
            type="submit"
            class="btn btn-success"
        >
            Enviar
        </button>

    </form>

</main>

</body>
</html>
