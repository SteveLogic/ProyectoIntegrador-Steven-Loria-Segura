<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Paciente - Sistema de Citas Médicas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">
                Sistema de Citas Médicas
            </span>
        </div>
    </nav>

    <main class="container py-5">
        <h1>Panel del paciente</h1>
        <p>Bienvenido al sistema de citas médicas.</p>
    </main>

    <script>
        const autenticado = sessionStorage.getItem("usuarioAutenticado");
        const rol = sessionStorage.getItem("rolUsuario");

        if (autenticado !== "true" || rol !== "paciente") {
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
