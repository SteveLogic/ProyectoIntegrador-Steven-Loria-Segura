<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
    <meta name="referrer" content="no-referrer">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Restablecer contraseña - Sistema de Citas Médicas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
  <script src="js/api-config.js"></script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-semibold">
                Sistema de Citas Médicas
            </span>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center py-5">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">

                <div class="card shadow border-0">

                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">
                            Restablecer contraseña
                        </h4>
                    </div>

                    <div class="card-body p-4">

                        <p class="text-body-secondary text-center mb-4">
                            Elige una contraseña nueva utilizando el enlace que recibiste por correo.
                        </p>

                        <form id="restablecerForm">

                            <div class="mb-3">
                                <label for="nuevaPassword" class="form-label">
                                    Nueva contraseña
                                </label>

                                <input
                                    type="password"
                                    id="nuevaPassword"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="confirmarPassword" class="form-label">
                                    Confirmar contraseña
                                </label>

                                <input
                                    type="password"
                                    id="confirmarPassword"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div
                                id="mensajePassword"
                                class="alert d-none"
                                role="alert"
                            ></div>

                            <div class="d-grid">
                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Guardar nueva contraseña
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const parametros = new URLSearchParams(window.location.hash.slice(1));
        const token = parametros.get("token");
        // Eliminar el token de la barra de direcciones y del historial visible.
        history.replaceState(null, "", window.location.pathname);
        const formulario = document.getElementById("restablecerForm");
        const mensajePassword = document.getElementById("mensajePassword");
        const boton = formulario.querySelector('button[type="submit"]');
        function mensaje(texto, correcto = false) {
            mensajePassword.className = `alert alert-${correcto ? "success" : "danger"}`;
            mensajePassword.textContent = texto;
        }
        if (!token || !/^[a-f0-9]{64}$/.test(token)) {
            mensaje("El enlace no es válido. Solicita uno nuevo desde Olvidé mi contraseña.");
            boton.disabled = true;
        }
        formulario.addEventListener("submit", async event => {
            event.preventDefault();
            const nuevaPassword = document.getElementById("nuevaPassword").value;
            const confirmarPassword = document.getElementById("confirmarPassword").value;
            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(nuevaPassword) ||
                new TextEncoder().encode(nuevaPassword).length > 72) {
                mensaje("Utiliza 8 caracteres o más, mayúscula, minúscula y número; máximo 72 bytes.");
                return;
            }
            if (nuevaPassword !== confirmarPassword) {
                mensaje("Las contraseñas no coinciden.");
                return;
            }
            boton.disabled = true;
            try {
                const respuesta = await fetch(`${window.CITAS_API_ORIGIN}/api/auth/restablecer-password`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, nuevaPassword })
                });
                const datos = await respuesta.json();
                mensaje(datos.mensaje || "No se pudo procesar la solicitud.", respuesta.ok);
                if (respuesta.ok) {
                    formulario.reset();
                    setTimeout(() => { window.location.href = "login.html"; }, 1500);
                } else {
                    boton.disabled = false;
                }
            } catch {
                mensaje("No se pudo conectar con el servidor.");
                boton.disabled = false;
            }
        });
    </script>

</body>
</html>
